name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean verify

      # The conformance matrix is this repository's claim about itself, so its
      # report goes into the job log rather than staying in a surefire file.
      - name: Conformance matrix
        if: always()
        run: mvn -B test -Dtest=ConformanceMatrixTest -Dsurefire.useFile=false
