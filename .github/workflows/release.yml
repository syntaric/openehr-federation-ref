name: Release

# Triggered by a semver tag. Deliberately minimal: it builds the tag, attaches
# the jar, and takes the release body from CHANGELOG.md.
#
# It uses only the workflow's own GITHUB_TOKEN — no PAT, no privileged secret
# and no push back to the repository. Version bumps and changelog edits are
# ordinary commits made before tagging, which keeps the tag a statement about
# a commit that already exists rather than one the workflow rewrites.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The full suite, not -DskipTests: a tag that cannot pass its own
      # conformance matrix should not become a release.
      - name: Build and test
        run: mvn -B clean verify

      - name: Extract the release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # The section for this version, from its heading to the next one.
          awk -v v="## $VERSION" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "No CHANGELOG.md section found for $VERSION" >&2
            exit 1
          fi
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: target/openehr-federation-ref-*.jar
          fail_on_unmatched_files: true
