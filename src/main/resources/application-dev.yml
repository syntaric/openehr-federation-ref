# Local development profile: static identity mappings against mock CDRs.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# No registry block here: point federation.registry.bootstrap-file at a document
# to populate one. Sources live in the database, and a YAML block reapplied at
# every boot would overwrite whatever is already there.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/federation
    username: federation
    password: federation

federation:
  security:
    default-outbound-profile: passthrough
  identity:
    mode: static
    static-mappings:
      "12345":
        node_1: 11111111-1111-1111-1111-111111111111
        node_2: 22222222-2222-2222-2222-222222222222
